server {
    listen 80 default_server;
    listen [::]:80 default_server;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;

    ssl_certificate /etc/ssl/certs/nginx-selfsigned.crt;
    ssl_certificate_key /etc/ssl/private/nginx-selfsigned.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    tcp_nodelay on;
    tcp_nopush off;

    location = /favicon.ico {
        alias /home/slalglel/workspace/wsl-agy-system/assets/favicons/favicon.ico;
        access_log off;
        auth_basic off;
        expires 30d;
    }

    location = /favicon.png {
        alias /home/slalglel/workspace/wsl-agy-system/assets/favicons/favicon.png;
        access_log off;
        auth_basic off;
        expires 30d;
    }

    location = /favicon.svg {
        alias /home/slalglel/workspace/wsl-agy-system/assets/favicons/favicon.svg;
        access_log off;
        auth_basic off;
        expires 30d;
    }

    # 무한의 계란 (Infinite Egg) 웹 게임 라우트
    location /infinity-egg/ {
        auth_basic off;
        alias /home/slalglel/workspace/infinite-egg/dist/;
        index index.html;
    }

    location = /infinity-egg {
        return 301 /infinity-egg/;
    }

    location / {
        # 웹 로그인 인증 활성화 (ttyd 관리용 터미널 보호)
        auth_basic "Restricted Access";
        auth_basic_user_file /etc/nginx/.htpasswd;

        proxy_pass http://127.0.0.1:57681;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}
